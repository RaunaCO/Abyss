[package]
name = "tide"
version = "1.0.1"
edition = "2021"
description = "Abyss, an unofficial native TIDAL desktop client written in Rust with GPUI"
license = "MIT"
default-run = "Abyss"

[[bin]]
name = "Abyss"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
open = "5"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "blocking"] }
roxmltree = "0.20"
unicode-segmentation = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
rand = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled"] }
lofty = { version = "0.25.5", path = "vendor/lofty-rs/lofty" }
tempfile = "3"

# Audio: decoding, high quality resampling, output
symphonia = { version = "0.5.4", default-features = false, features = ["flac", "isomp4", "aac", "mp3", "wav", "pcm"] }
rubato = "0.16"
cpal = "0.15.3"
rtrb = "0.3"
pinyin = "0.11.0"
# Japanese kanji readings for romaji. The embedded IPADIC dictionary is ~46 MiB
# of the binary; build with `--no-default-features` to leave it out (kana-only romaji).
lindera = { version = "6.2.0", default-features = false, features = ["embed-ipadic"], optional = true }

[features]
default = ["kanji-romaji"]
kanji-romaji = ["dep:lindera"]

[target.'cfg(windows)'.dependencies]
wasapi = "0.15"
# DPAPI for the session tokens (already in the dependency tree via other crates).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3"
