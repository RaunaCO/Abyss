[package]
name = "tide"
version = "1.8.2"
edition = "2021"
description = "Abyss, an unofficial native TIDAL desktop client written in Rust with Iced and wgpu"
license = "MIT"
default-run = "Abyss"

[[bin]]
name = "Abyss"
path = "src/main.rs"

[dependencies]
# The interface: Iced 0.14 on wgpu 27 (the wgpu release iced_wgpu 0.14 is built on).
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "image", "svg", "advanced", "canvas", "thread-pool", "web-colors"], optional = true }
wgpu = { version = "=27.0.1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# Native file and folder pickers.
rfd = { version = "0.15", optional = true }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
open = "5"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "blocking"] }
roxmltree = "0.20"
unicode-segmentation = "1"
sha2 = "0.10"
md-5 = { version = "0.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
rand = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
lofty = { version = "0.25.5", path = "vendor/lofty-rs/lofty" }
tempfile = "3"

# Audio: decoding, high quality resampling, output
symphonia = { version = "0.5.4", default-features = false, features = ["flac", "isomp4", "aac", "alac", "mp3", "wav", "aiff", "pcm", "ogg", "vorbis"] }
rubato = "0.16"
cpal = "0.15.3"
rtrb = "0.4"
pinyin = "0.11.0"
# Japanese kanji readings for romaji. The embedded IPADIC dictionary is ~46 MiB
# of the binary; build with `--no-default-features` to leave it out (kana-only romaji).
lindera = { version = "6.2.0", default-features = false, features = ["embed-ipadic"], optional = true }

[features]
# Iced is the desktop interface (GPUI, the original one, was retired in 1.7;
# see docs/MIGRATION-ICED.md).
default = ["kanji-romaji", "ui-iced"]
kanji-romaji = ["dep:lindera"]
ui-iced = ["dep:iced", "dep:wgpu", "dep:bytemuck", "dep:rfd"]

[target.'cfg(windows)'.dependencies]
wasapi = "0.15"
# DPAPI for the session tokens (already in the dependency tree via other crates).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3"

# Iced's glyph renderer with GPUI's text alpha correction (vendor/cryoglyph/src/shader.wgsl).
[patch.crates-io]
cryoglyph = { path = "vendor/cryoglyph" }
